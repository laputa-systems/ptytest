[package]
name = "laputa-ptytest"
description = "laputa-ptytest"
version = "0.2.0"
edition = "2024"
license = "MIT"
exclude = ["tools/bump_minor_release.sh"]

# Keep the published package name distinct from the Rust crate name used by
# consumers (`use ptytest::...`).
[lib]
name = "ptytest"

[dependencies]
libc = "0.2"
vt100 = "0.16.2"

[dev-dependencies]
alacritty_terminal = "0.26.0"

[[bin]]
name = "ptytest-fixture"
path = "tests/support/ptytest_fixture.rs"
