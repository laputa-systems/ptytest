name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} PTY acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record runner and locale evidence
        run: |
          rustc -Vv
          uname -sr
          locale -a
      - run: cargo clippy --locked --all-targets --all-features -- --deny warnings
      - run: cargo test --locked
      - run: cargo test --locked -- --test-threads=1
      - name: Upload PTY failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptytest-failures-${{ matrix.os }}
          path: |
            target/ptytest-failures
            target/ptytest-differential
          if-no-files-found: ignore

  differential:
    name: ${{ matrix.os }} nightly differential terminal corpus
    if: github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the toolchain; this installs it.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Record runner and locale evidence
        run: |
          rustc -Vv
          uname -sr
          locale -a
      - run: cargo test --locked differential_oracle_matches_canonical_terminal_corpus
      - run: cargo test --locked differential_oracle_matches_canonical_terminal_corpus -- --test-threads=1
      - name: Upload differential disagreement evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ptytest-differential-${{ matrix.os }}
          path: target/ptytest-differential
          if-no-files-found: ignore
